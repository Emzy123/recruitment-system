name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Lint Codebase
      run: npm run lint
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Run Tests
      run: npm run test
      env:
        MONGODB_URI: mongodb://localhost:27017/recruitment_test_db
        NEXTAUTH_SECRET: testing-secret-key-do-not-use-in-production
        NEXTAUTH_URL: http://localhost:3000
